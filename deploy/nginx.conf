# Replace hosting.example and certificate paths with your own verified domain.
server {
    listen 80;
    server_name hosting.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name hosting.example;
    ssl_certificate /etc/letsencrypt/live/hosting.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosting.example/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        # Overwrite incoming forwarded values; this is the one trusted proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 35s;
    }
}
