{% extends 'base.html' %}{% block content %}<h1>{{ title }}</h1><div class="table-wrap"><table data-data-table><thead><tr><th>Time ({{ workspace_timezone }})</th><th>Actor</th><th>Event</th><th>Detail</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.created_at|localdate }}</td><td>{{ event.actor_id or 'System' }}</td><td>{{ event.event }}</td><td>{{ event.detail }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
